<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbe6f0"/>
      <stop offset="55%" stop-color="#f8d7e8"/>
      <stop offset="100%" stop-color="#f0c2da"/>
    </linearGradient>
    <linearGradient id="table2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c98a4b"/>
      <stop offset="100%" stop-color="#a8672f"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eee3e8"/>
    </radialGradient>
    <radialGradient id="sunGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7e0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff7e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#fdeee0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky2)"/>
  <circle cx="640" cy="90" r="150" fill="url(#sunGlow2)"/>

  <g opacity="0.55">
    <ellipse cx="130" cy="80" rx="70" ry="20" fill="#ffffff"/>
    <ellipse cx="180" cy="70" rx="46" ry="16" fill="#ffffff"/>
    <ellipse cx="590" cy="55" rx="55" ry="15" fill="#ffffff"/>
  </g>

  <!-- little jam jar, whimsical touch -->
  <g transform="translate(100,300)">
    <ellipse cx="0" cy="95" rx="30" ry="7" fill="#c98a4b" opacity="0.35"/>
    <rect x="-22" y="20" width="44" height="65" rx="8" fill="#f4c9d8"/>
    <rect x="-24" y="8" width="48" height="16" rx="6" fill="#e8a6bf"/>
    <rect x="-10" y="-6" width="20" height="16" fill="#c98a4b"/>
  </g>

  <!-- wooden table -->
  <rect x="0" y="360" width="800" height="140" fill="url(#table2)"/>
  <g stroke="#8f5a28" stroke-width="2" opacity="0.4">
    <line x1="0" y1="385" x2="800" y2="385"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="0" y1="455" x2="800" y2="455"/>
  </g>

  <!-- plate shadow -->
  <ellipse cx="400" cy="420" rx="220" ry="26" fill="#5a3616" opacity="0.35"/>

  <!-- plate -->
  <ellipse cx="400" cy="345" rx="220" ry="52" fill="#dcc9d1"/>
  <ellipse cx="400" cy="338" rx="205" ry="46" fill="url(#plate)"/>
  <ellipse cx="400" cy="338" rx="150" ry="34" fill="#f6eef2"/>

  <!-- mug of hot chocolate / mousse cup as centerpiece dessert -->
  <g transform="translate(400,300)">
    <!-- cup body -->
    <path d="M -70 -10 L -60 60 C -60 78, 60 78, 60 60 L 70 -10 Z" fill="#8a5a3c"/>
    <ellipse cx="0" cy="-10" rx="70" ry="18" fill="url(#cream)"/>
    <!-- cream swirl -->
    <path d="M -30 -18 C -20 -34, 20 -34, 30 -18 C 34 -8, 10 -6, 0 -14 C -10 -6, -34 -8, -30 -18 Z" fill="#fffdf8"/>
    <circle cx="-14" cy="-24" r="7" fill="#fffdf8"/>
    <circle cx="12" cy="-26" r="6" fill="#fffdf8"/>
    <!-- cherry on top -->
    <circle cx="0" cy="-30" r="7" fill="#d1425a"/>
    <path d="M0 -37 C 4 -44, 10 -44, 12 -50" stroke="#4c7d3f" stroke-width="2" fill="none"/>
    <!-- chocolate drizzle -->
    <g stroke="#5a3620" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M -40 -8 C -34 -2, -30 4, -26 10"/>
      <path d="M 20 -6 C 26 0, 30 6, 34 12"/>
    </g>
  </g>

  <!-- cookie beside the cup -->
  <g transform="translate(280,360)">
    <circle cx="0" cy="0" r="26" fill="#c98a4b"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#a8672f" stroke-width="2"/>
    <circle cx="-8" cy="-6" r="3" fill="#5a3620"/>
    <circle cx="7" cy="-2" r="3" fill="#5a3620"/>
    <circle cx="-3" cy="9" r="3" fill="#5a3620"/>
    <circle cx="10" cy="8" r="2.5" fill="#5a3620"/>
  </g>

  <!-- strawberry slice on the other side -->
  <g transform="translate(510,362)">
    <path d="M -22 0 C -22 -26, 22 -26, 22 0 C 22 14, -22 14, -22 0 Z" fill="#e8536b"/>
    <path d="M -22 0 C -22 -26, 22 -26, 22 0" fill="none" stroke="#c9394f" stroke-width="2"/>
    <g stroke="#ffd9df" stroke-width="1.5">
      <line x1="0" y1="-22" x2="0" y2="-4"/>
      <line x1="-12" y1="-18" x2="-4" y2="-4"/>
      <line x1="12" y1="-18" x2="4" y2="-4"/>
    </g>
  </g>

  <!-- mint leaf garnish -->
  <path d="M 470 320 C 452 306, 448 288, 462 274 C 476 288, 480 306, 470 320 Z" fill="#6faa5e"/>

  <!-- gentle steam wisps -->
  <g stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M 370 250 C 360 220, 380 205, 370 175"/>
    <path d="M 430 250 C 440 220, 420 205, 430 175"/>
  </g>
</svg>
